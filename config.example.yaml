github:
  token: ""  # 留空则自动使用 gh auth token

# UI language: en, zh, or leave empty to use COMMITLENS_LANG / system LANG
language: ""

reporting:
  # IANA timezone used for day/week/month/quarter/year boundaries.
  # "Local" uses the machine timezone.
  timezone: Local

repositories:
  # Web mode: discover repositories from an organization, then select which
  # repositories to synchronize from the repository dropdown.
  - owner: example-org
  # Exact repositories remain part of the default synchronization set.
  - owner: jimyag
    repo: commitlens
  - owner: jimyag
    repo: jvp

cache:
  dir: ~/.commitlens/cache

web:
  port: 8080
